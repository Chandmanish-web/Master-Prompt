services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: worktrack
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=mongodb://mongo:27017/worktrack
      - JWT_SECRET=worktrack-dev-secret
      - PORT=5000
      - CLIENT_URL=http://localhost:4173
    ports:
      - '5000:5000'
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://localhost:5000/api
    ports:
      - '4173:4173'
    depends_on:
      - server

volumes:
  mongo-data:
