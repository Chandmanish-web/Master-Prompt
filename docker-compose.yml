# Docker Compose for WorkTrack Development
# IMPORTANT: Use .env file for sensitive values, not hardcoded here
# Create a .env file with:
# MONGO_URI=mongodb://mongo:27017/worktrack (local) or mongodb+srv://user:pass@cluster.mongodb.net/worktrack (Atlas)
# JWT_SECRET=your-secret-key
# NODE_ENV=development

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: worktrack
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/worktrack}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-development}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:4173}
    ports:
      - '5000:5000'
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.get('http://127.0.0.1:5000/api/health', res => process.exit(res.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    restart: unless-stopped
    ports:
      - '4173:4173'
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4173"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongo-data:
