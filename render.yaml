services:
  - type: web
    name: worktrack-server
    runtime: docker
    dockerfilePath: server/Dockerfile
    autoDeploy: true
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
  - type: static
    name: worktrack-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    publishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false
